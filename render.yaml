# Render Blueprint: one web service + one PostgreSQL database.
# In Render: New > Blueprint > pick this repository. See DEPLOY.md.
databases:
  - name: trustvault-db
    plan: free
    databaseName: trustvault
    user: trustvault

services:
  - type: web
    name: trustvault
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    # Schema and seed are both idempotent: safe on every deploy.
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      # Long random secret for the audit hash chain, generated by Render.
      # Never change it after the first deploy, or existing entries will no longer verify.
      - key: AUDIT_HMAC_KEY
        generateValue: true
      # Seed account passwords: enter them in the Render dashboard (sync: false keeps them out of git).
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_OWNER_PASSWORD
        sync: false
      - key: SEED_VIEWER_PASSWORD
        sync: false
